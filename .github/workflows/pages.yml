name: Deploy to GitHub Pages

# Deploys only from main (plus manual runs) so feature branches don't publish
# over the live site.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement asks the API to turn Pages on, but GITHUB_TOKEN is refused
      # ('Resource not accessible by integration'), so Pages still has to be
      # enabled once under Settings -> Pages -> Source: GitHub Actions. Kept
      # because it is a no-op once the site exists.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
