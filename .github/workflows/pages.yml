name: Deploy to GitHub Pages

# Deploys only from main (plus manual runs) so feature branches don't publish
# over the live site. Requires Pages to be enabled once under
# Settings -> Pages -> Build and deployment -> Source: GitHub Actions;
# GITHUB_TOKEN is not permitted to turn Pages on by itself.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
